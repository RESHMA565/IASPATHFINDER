<!-- templates/notes.html -->

<!DOCTYPE html>
<html>
<head>

    <title>Notes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success">

    <div class="container">

        <a class="navbar-brand">
            Notes System
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="card shadow p-4 mb-5">

        <h2 class="mb-4">
            Add Notes
        </h2>

        <form method="POST">

            <input type="text" name="title" class="form-control mb-3" placeholder="Title" required>

            <input type="text" name="subject" class="form-control mb-3" placeholder="Subject" required>

            <textarea name="content" class="form-control mb-3" rows="5" placeholder="Write notes here..." required></textarea>

            <button class="btn btn-success">
                Save Note
            </button>

        </form>

    </div>

    <h2 class="mb-4">
        My Notes
    </h2>

    {% for note in notes %}

    <div class="card shadow p-4 mb-3">

        <h4>
            {{ note.title }}
        </h4>

        <h6 class="text-primary">
            {{ note.subject }}
        </h6>

        <p>
            {{ note.content }}
        </p>

    </div>

    {% endfor %}

</div>

</body>
</html>
